[package]
name = "flurry"
version = "0.1.0"
edition = "2021"
description = "Desktop snow for Linux"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
directories = "6.0.0"
env_logger = "0.11.11"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[profile.release]
lto = "thin"
