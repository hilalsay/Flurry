[package]
name = "flurry"
version = "0.1.0"
edition = "2021"
description = "Desktop snow for Linux"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
directories = "6.0.0"
env_logger = "0.11.11"
fastrand = "2.5.0"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
log = "0.4.35"
rustix = { version = "1.1.6", features = ["event", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
tiny-skia = "0.12.0"
toml = "1.2.1"
x11rb = { version = "0.14.0", features = ["shape", "randr", "render", "xinput"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
lto = "thin"
